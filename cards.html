<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Collection · Space Collector</title>
  <script>try { if (localStorage.getItem('night') === '1') { document.documentElement.dataset.theme = 'night'; document.querySelector('meta[name="theme-color"]').content = '#090303'; } } catch {}</script>
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700;750;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css?v=0.1.58">
  <link rel="stylesheet" href="css/collection.css?v=0.1.58">
</head>
<body>
  <header class="collection-header">
    <a class="brand" href="./?resume=1"><svg viewBox="0 0 32 24" fill="none" aria-hidden="true"><circle cx="16" cy="12" r="7"/><ellipse cx="16" cy="12" rx="15" ry="4.5" transform="rotate(-30 16 12)"/></svg><span>SPACE COLLECTOR</span></a>
    <button class="icon-button" id="night-toggle" type="button" aria-label="Turn on red night mode" aria-pressed="false">☾</button>
  </header>
  <main id="collection-main">
    <div class="collection-intro"><p class="eyebrow">YOUR ORBITAL FIELD GUIDE</p><h1>A little closer<br>to the cosmos.</h1><p id="count">Opening your collection…</p></div>
    <div class="collection-tabs" aria-label="Collection view"><button type="button" id="tab-owned" aria-pressed="true">My collection <span id="owned-count">0</span></button><button type="button" id="tab-discover" aria-pressed="false">Discover</button></div>
    <div class="collection-tools"><label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="Find a spacecraft, launch or story…" aria-label="Search cards" autocomplete="off"></label><div class="filter-row"><label class="filter"><span>Collection</span><select id="set-filter" aria-label="Filter by collection"><option value="all">All collections</option></select></label><label class="filter"><span>Rarity</span><select id="rarity-filter" aria-label="Filter by rarity"><option value="all">All rarities</option></select></label></div></div>
    <div class="result-row"><span id="results" aria-live="polite"></span><button type="button" id="reset-filters" hidden>Clear filters</button></div>
    <p class="collection-notice" id="notice" role="status" hidden></p>
    <div class="grid" id="grid" aria-label="Collectible cards"><p class="loading">Opening the field guide…</p></div>
    <p class="storage-note">Your sightings live on this device.</p>
  </main>
  <nav class="bottom-nav" aria-label="Main navigation"><a href="./?resume=1"><span aria-hidden="true">✧</span>Explore</a><a href="cards.html" aria-current="page"><span aria-hidden="true">▱</span>Collection</a></nav>

  <dialog id="viewer" aria-label="Collectible card viewer">
    <div class="viewer-header"><span id="v-position"></span><button class="close" id="v-close" type="button" autofocus>Done <span aria-hidden="true">×</span></button></div>
    <div class="viewer-scroll"><div id="slot"></div><p id="v-status" class="viewer-status" aria-live="polite"></p><button id="v-preview" class="preview-button" type="button" hidden>Preview artwork &amp; story</button><div id="v-history" class="viewer-history"></div></div>
  </dialog>
  <script type="module" src="js/cards-page.js?v=0.1.58"></script>
</body>
</html>
