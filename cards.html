<!doctype html>
<html lang="en">
<head>
<script>/* No Safari bars (Home Screen app or the native app): the bottom inset is the home-indicator strip, so pull the
  bottom controls down into part of it (2026-10-11, Sevaan: the switcher and toasts sat too high there). */
  if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || window.Capacitor?.isNativePlatform?.()) document.documentElement.classList.add('standalone');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f18">
  <meta name="color-scheme" content="dark">
  <style>html, body { background: #080f18; } html[data-theme="night"], html[data-theme="night"] body { background: #120404; }</style><!-- dark from the first paint: no white flash (2026-10-07) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Collection · Space Collector</title>
  <script>try { if (localStorage.getItem('night') === '1') { document.documentElement.dataset.theme = 'night'; document.querySelector('meta[name="theme-color"]').content = '#090303'; } } catch {}</script>
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700;750;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="fonts/RussoOne-Regular.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="stylesheet" href="css/cards.css?v=0.1.1010">

<body>
  <header class="collection-header sky-header"><span class="wordmark">SPACE COLLECTOR<span>COLLECT THE NIGHT SKY</span></span><span class="header-buttons"><button class="icon-button" id="night-toggle" type="button" aria-label="Turn on red night mode" aria-pressed="false">☾</button><a class="icon-button" href="./?resume=1&amp;more=1" aria-label="Settings"><span class="ico" data-ico="sliders"></span></a></span></header>
  <main id="collection-main">
    <div class="collection-intro"><p class="eyebrow">YOUR ORBITAL FIELD GUIDE</p><h1>A little closer<br>to the cosmos.</h1><p id="count">Opening your collection…</p></div>
    <section class="logbook" id="logbook" aria-label="Your logbook" hidden></section>
    <div class="lb-slim" id="lb-slim" aria-hidden="true"></div><!-- the rank card folded to one row once it scrolls away (2026-10-21, design/collection-rank.html D) -->
    <button class="stats-link ui-link" id="stats-open" type="button" hidden>Observer stats ›</button>
    <div class="collection-tabs" aria-label="Collection view"><button type="button" id="tab-owned" aria-pressed="true">Mine <span id="owned-count">0</span></button><button type="button" id="tab-albums" aria-pressed="false">Albums</button><button type="button" id="tab-patches" aria-pressed="false">Patches</button><button type="button" id="tab-discover" aria-pressed="false">Find</button></div>
    <div class="collection-tools"><div class="search-line"><label class="search"><span class="search-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg></span><input type="search" id="search" spellcheck="false" autocorrect="off" placeholder="Search cards…" aria-label="Search cards" autocomplete="off"></label><button type="button" class="filters-btn" id="filters-btn" aria-expanded="false" aria-controls="filter-row">Filters<i aria-hidden="true"></i></button></div><div class="filter-row" id="filter-row"><label class="filter"><span>Album</span><select id="set-filter" aria-label="Filter by album"><option value="all">Album</option></select></label><label class="filter"><span>Rarity</span><select id="rarity-filter" aria-label="Filter by rarity"><option value="all">Rarity</option></select></label><label class="filter sort"><span>Sort</span><select id="sort-by" aria-label="Sort cards"><option value="auto">Sort</option><option value="newest">Newest first</option><option value="rarest">Rarest first</option><option value="az">A to Z</option></select></label></div></div>
    <div class="album-head" id="album-head" hidden></div>
    <div class="result-row"><span id="results" aria-live="polite"></span><button type="button" id="reset-filters" hidden>Clear filters</button></div>
    <p class="collection-notice" id="notice" role="status" hidden></p>
    <div class="patch-wall" id="patch-wall" hidden></div>
    <div class="grid" id="grid" aria-label="Collectible cards"><p class="loading">Opening the field guide…</p></div>
  </main>
  <nav class="bottom-nav sc-switch" data-side="right" style="--n:2;--i:1" aria-label="Main navigation"><a class="sc-switch__item" href="./?resume=1"><span class="ico" data-ico="sight" aria-hidden="true"></span>Explore</a><a class="sc-switch__item" href="cards.html" aria-current="page"><span class="ico" data-ico="deck" aria-hidden="true"></span>Collection</a></nav>

  <div id="dock-empty" aria-hidden="true"><span class="de-card">✦</span><span>Tap a card<br>to look closer</span></div>
  <dialog id="stats-view" aria-label="Observer stats"><div class="viewer-header"><span class="ui-eyebrow">Observer stats</span><button class="close x-close" id="stats-close" type="button" aria-label="Close">✕</button></div><div class="stats-body" id="stats-body"></div></dialog>
  <dialog id="patch-view" aria-label="Mission patch"><div class="viewer-header"><span id="pv-position" class="ui-eyebrow"></span><button class="close x-close" id="pv-close" type="button" aria-label="Close">✕</button></div><div class="pv-body" id="pv-body"></div></dialog>
  <dialog id="viewer" aria-label="Collectible card viewer">
    <div class="viewer-header"><span id="v-position" class="ui-eyebrow"></span><button class="close x-close" id="v-close" type="button" aria-label="Close">✕</button></div>
    <div class="viewer-scroll"><div id="slot"></div><div id="v-up" class="v-up" hidden></div><p id="v-where" class="v-where" hidden></p><p id="v-status" class="viewer-status" aria-live="polite"></p><button id="v-share" class="ui-link" type="button" hidden>Share this card</button><div id="v-next" class="v-next" hidden></div><button id="v-preview" class="ui-btn" type="button" hidden>Preview artwork</button><div id="v-history" class="viewer-history"></div></div>
  </dialog>
  <script type="module" src="js/text-size.js?v=0.1.1010"></script>
  <script type="module" src="js/clock.js?v=0.1.1010"></script>
  <script type="module" src="js/cards-page.js?v=0.1.1010"></script>
