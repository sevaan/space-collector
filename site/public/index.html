<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Collector</title>
<meta name="description" content="A collecting game for the night sky. Point your phone up, line up a satellite, a planet or a star, and collect it as a card. Coming soon to iPhone and Android.">
<link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=Russo+One&display=swap">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(90% 70% at 50% 110%, #12283a, #080f1b 65%) #080f1b; color: #fff2b3; font: 400 17px/1.55 'Barlow', system-ui, sans-serif; display: grid; place-items: center; text-align: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
main { display: grid; justify-items: center; gap: 18px; max-width: 34em; }
img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 20px 50px #0009; }
h1 { margin: 0; font: 400 clamp(34px, 8vw, 60px)/1 'Russo One', 'Arial Black', sans-serif; }
p { margin: 0; color: #adbcc8; }
.soon { font: 600 14px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #fa8127; }
footer { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 10px; font: 500 14px/1 'Barlow Condensed', sans-serif; letter-spacing: .14em; text-transform: uppercase; }
a { color: #fff2b3; }
</style>
</head>
<body>
<script src="/loader.js"></script>
<main>
  <img src="/icon.png" alt="Space Collector app icon">
  <h1>Space Collector</h1>
  <p>Every light up there is a card. Point your phone at the night sky, line up a satellite, a planet or a star in the circle, and collect it.</p>
  <p class="soon">Coming soon to iPhone &amp; Android</p>
  <footer><a href="mailto:hello@spacecollector.app">hello@spacecollector.app</a><a href="/privacy">Privacy</a></footer>
</main>
</body>
</html>
