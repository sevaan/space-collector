<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Count Options</title>
<style>
  @font-face { font-family: 'SC Label'; src: url('../fonts/BarlowCondensed-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'SC Display'; src: url('../fonts/RussoOne-Regular.ttf'); }
  body { margin: 0; background: #04070d; color: #e8eef6; font: 15px/1.45 -apple-system, system-ui, sans-serif; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 6px; } .intro { color: #9fb0c6; margin: 0 0 24px; max-width: 820px; }
  .board { display: flex; flex-wrap: wrap; gap: 30px 24px; justify-content: center; }
  .opt { width: 390px; max-width: 100%; } .opt h2 { font-size: 16px; margin: 12px 0 4px; } .opt p { color: #9fb0c6; font-size: 13.5px; margin: 0; }
  .strip { position: relative; width: 390px; height: 170px; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid #1d2838;
    background: radial-gradient(1px 1px at 70% 30%, #fff8, transparent), radial-gradient(1px 1px at 85% 70%, #fff6, transparent), radial-gradient(1px 1px at 55% 80%, #fff7, transparent), radial-gradient(1.5px 1.5px at 92% 20%, #fff9, transparent), #0b1322; }
  .rule { position: absolute; left: 16px; right: 16px; top: 12px; height: 4px; border-top: 1px solid #3a4a5e; border-bottom: 1px solid #3a4a5e; }
  .radar { position: absolute; left: 8px; top: 30px; width: 120px; height: 120px; background: url(count-radar.png) center / cover; }
  .lab { font: 500 14px/1 'SC Label', 'Arial Narrow', sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .num { font: 400 15px/1 'SC Display', Impact, sans-serif; letter-spacing: 0; }
  .cream { color: #fff2b3; } .orange { color: #fa8127; } .dim { color: rgba(255, 242, 179, .55); }
  /* A: pill like the switcher */
  .A .c { position: absolute; left: 140px; top: 76px; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border-radius: 99px;
    background: rgba(8, 14, 26, .7); border: 1px solid #344654; }
  /* B: no box, two quiet lines */
  .B .c { position: absolute; left: 142px; top: 68px; line-height: 1.5; text-shadow: 0 1px 4px #000; }
  .B .c div { display: flex; gap: 6px; align-items: baseline; }
  /* C: on the radar itself */
  .C .badge { position: absolute; left: 100px; top: 34px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #0b1322; border: 1px solid #fa8127;
    display: grid; place-items: center; color: #fa8127; font: 500 13px/1 'SC Label', sans-serif; letter-spacing: .04em; box-shadow: 0 0 10px rgba(250, 129, 39, .35); }
  .C .under { position: absolute; left: 8px; width: 120px; top: 150px; text-align: center; font-size: 12px; }
  .cur .c { position: absolute; left: 136px; top: 66px; display: flex; align-items: baseline; gap: 6px; padding: 10px 16px; border: 1.5px solid #8a9bab; border-radius: 10px; background: #0b1322; }
  .cur .c .num { font-size: 22px; }
</style></head><body>
<h1>"Up / new" counter: three quieter options</h1>
<p class="intro">Same radar and sky as your screenshot, current version first. Each keeps the numbers readable at a glance but stops looking like a button.</p>
<div class="board" id="b"></div>
<script>
const opts = [
  ['cur', 'Now', 'Big framed box with large numbers: reads like a button and outweighs the radar.',
   `<div class="c lab"><span class="num cream">14</span><span class="cream">up ·</span><span class="num orange">14</span><span class="orange">new</span></div>`],
  ['A', 'A. Small pill', 'The same small dark pill as the switcher, with smaller numbers: "14 up · 14 new". Matches the bottom of the screen.',
   `<div class="c lab"><span class="num cream">14</span><span class="dim">up</span><span class="dim">·</span><span class="num orange">14</span><span class="orange">new</span></div>`],
  ['B', 'B. Just text', 'No box at all: two quiet lines beside the radar, "14 in the sky" and "14 new", like a caption on a chart. The lightest option.',
   `<div class="c lab"><div><span class="num cream">14</span><span class="dim">in the sky</span></div><div><span class="num orange">14</span><span class="orange">new</span></div></div>`],
  ['C', 'C. On the radar', 'The new count becomes a small orange badge on the radar\'s edge (like an app badge), and "14 up" sits tiny under the dial. Frees the space beside the radar entirely.',
   `<div class="badge">14</div><div class="under lab dim">14 up</div>`],
];
document.getElementById('b').innerHTML = opts.map(([c, t, d, h]) => `<div class="opt"><div class="strip ${c}"><div class="rule"></div><div class="radar"></div>${h}</div><h2>${t}</h2><p>${d}</p></div>`).join('');
</script></body></html>
