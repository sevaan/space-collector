<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Samples</title>
<link rel="stylesheet" href="../css/cards.css">
<style>
  body { margin: 0; background: #080e1a; color: #fff2b3; font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 20px 16px 4px; } p { margin: 0 16px 16px; color: #9aa6bd; max-width: 60em; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; padding: 8px 16px 40px; justify-content: center; }
  .row > div { width: min(340px, 100%); font-size: 12px; } /* card is 28em wide */
  /* Sample artwork replaces the drawn temp art in the art window */
  .card__art img.sample { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card__art { position: relative; overflow: hidden; }
</style></head>
<body>
<h1>Card art samples (Gemini, Nano Banana 2)</h1>
<p>Generated in the poster style for four cards and dropped into the real card face. Drag a card (or tilt your phone) for the holo.</p>
<div class="row" id="row"></div>
<script type="module">
import { renderCard, attachTilt } from '../js/card.js';
import { buildCards } from '../js/card-model.js';
import { loadLore } from '../js/lore.js';
import { artKeyFor } from '../js/art-keys.js';
const [cat, series] = await Promise.all([fetch('../data/catalog.json').then((r) => r.json()), fetch('../data/series.json').then((r) => r.json()), loadLore('../data/lore.json')]);
const cards = buildCards(cat);
const key = (c) => artKeyFor(c, series.members);
const rank = { legendary: 0, epic: 1, rare: 2, uncommon: 3, common: 4 };
const pick = (k) => cards.filter((c) => key(c) === k).sort((a, b) => rank[a.tier] - rank[b.tier])[0];
const now = Date.now();
for (const k of ['iss', 'strela-1m', 'sl-8', 'planet-saturn']) {
  const c = pick(k); if (!c) continue;
  const el = renderCard(c, { sightings: [{ time: now, cardKey: c.key }], preview: true });
  const art = el.querySelector('[data-art-slot]');
  [...art.children].forEach((n) => { if (!n.classList.contains('card__foil')) n.remove(); });
  const img = new Image(); img.className = 'sample'; img.src = `art-samples/${k}.webp`; img.alt = '';
  art.prepend(img);
  const box = document.createElement('div'); box.append(el); document.getElementById('row').append(box);
  attachTilt(el);
}
</script>
</body></html>
