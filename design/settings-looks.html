<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings looks</title>
<style>
@font-face { font-family: 'L'; src: url('../fonts/BarlowCondensed-Medium.ttf'); }
@font-face { font-family: 'D'; src: url('../fonts/RussoOne-Regular.ttf'); }
:root { --bg: #080f1b; --ink: #fff2b3; --muted: #bdbea9; --gold: #fa8127; --medal: #ffc93d; --soft: #22344a; }
* { box-sizing: border-box; }
body { margin: 0; background: #1b2230; color: var(--ink); font: 500 15px/1.3 'L', sans-serif; padding: 24px 16px 60px; }
h1 { font: 400 26px/1.1 'D'; margin: 0 0 6px; } .lead { color: var(--muted); margin: 0 0 22px; max-width: 900px; }
.row { display: flex; flex-wrap: wrap; gap: 22px; }
.opt { width: 360px; }
.opt > h2 { font: 400 18px 'D'; margin: 0 0 4px; } .opt > p { margin: 0 0 10px; color: var(--muted); font-size: 14px; min-height: 54px; }
.opt > p b { color: var(--gold); font-weight: 500; }
.phone { width: 360px; height: 700px; overflow: hidden; border-radius: 28px; background: var(--bg); border: 1px solid #2c3648; position: relative; }
.hdr { padding: 34px 20px 14px; border-bottom: 3px double #627a8b; margin-bottom: 14px; }
.hdr b { display: block; font: 400 20px 'D'; text-transform: uppercase; } .hdr small { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.pg { padding: 0 16px; }
.ico { width: 22px; height: 22px; flex: none; color: var(--ink); opacity: .9; }
.r { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; }
.r .m { flex: 1; min-width: 0; } .r .m b { display: block; font-weight: 500; font-size: 16px; } .r .m small { display: block; color: var(--muted); font-size: 13px; }
.r .v { color: var(--muted); font-size: 14px; } .r .ch { color: var(--muted); }
.tog { font: 600 11px 'L'; letter-spacing: .14em; padding: 5px 8px; border-radius: 6px; border: 1px solid #45576a; color: var(--muted); }
.tog.on { border-color: var(--gold); color: var(--gold); }
.sw { width: 44px; height: 26px; border-radius: 13px; background: #2a3a4c; position: relative; flex: none; } .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); }
.sw.on { background: var(--gold); } .sw.on::after { left: 21px; background: var(--bg); }
.sl { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--gold) 46%, #22324a 46%); margin: 8px 0 2px; position: relative; } .sl::after { content: ''; position: absolute; left: 46%; top: -8px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--bg); }
.lnk { color: var(--gold); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }

/* A — today: field cards (double frame, numbered header bar) */
.A .card { border: 2px solid #cfd6c2; border-radius: 12px; box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 4px #cfd6c255; margin-bottom: 14px; overflow: hidden; }
.A .bar { display: flex; justify-content: space-between; padding: 10px 14px; background: #ffc93d14; border-bottom: 1px solid #cfd6c255; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.A .r + .r { border-top: 1px solid #ffffff12; }

/* B — quiet panels: heading outside, one plain panel (matches Tonight) */
.B .sec { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 18px 4px 8px; } .B .sec:first-child { margin-top: 2px; }
.B .card { border: 1px solid var(--soft); border-radius: 14px; background: #0e1a29; overflow: hidden; }
.B .r + .r { border-top: 1px solid #ffffff10; }
.B .ib { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: #ffffff0a; flex: none; }

/* C — no boxes: one long divided list like Tonight's run */
.C .sec { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 20px 0 4px; } .C .sec:first-child { margin-top: 2px; } .C .sec span { color: var(--muted); letter-spacing: .1em; }
.C .r { padding: 8px 0; border-top: 1px solid #ffffff12; }

/* D — card stock: each group is a game card (navy stock, silver frame, picture-less header in the display font) */
.D .card { border: 2px solid #adbcc8; border-radius: 14px; box-shadow: inset 0 0 0 1px #657786; margin-bottom: 14px; background: radial-gradient(ellipse at 50% 0, #14243a, #0b1524 70%); overflow: hidden; }
.D .bar { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 6px; }
.D .bar b { font: 400 17px 'D'; text-transform: uppercase; } .D .bar span { font-size: 12px; letter-spacing: .16em; color: var(--muted); }
.D .r + .r { border-top: 1px solid #ffffff10; }
.rec { display: inline-block; margin-left: 6px; font: 600 11px 'L'; letter-spacing: .12em; padding: 2px 6px; border-radius: 5px; background: var(--gold); color: var(--bg); vertical-align: 3px; }
</style></head><body>
<h1>Settings looks</h1>
<p class="lead">Same rows and wording in each, only the look changes. A is today. The audit's point: Settings is the only page with its own frame colour, numbered gold bars and boxed toggles, so it reads like a different app from Tonight and the Collection.</p>
<div class="row" id="row"></div>
<template id="rows">
  <!--S Collection 01-->
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><div class="m"><b>Observer stats</b><small>Your nights, places and rarest finds</small></div><span class="ch">›</span></div>
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/></svg><div class="m"><b>Space Collector Plus</b><small>Reminders, card backs and more</small></div><span class="v">Free</span><span class="ch">›</span></div>
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="2"/></svg><div class="m"><b>Card back</b><small>The back of every card you flip</small></div><span class="v">Mission Control</span><span class="ch">›</span></div>
  <!--S Your sky 02-->
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><div class="m"><b>Your location</b><small>Using where you are now</small></div><span class="ch">›</span></div>
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-4 1 2-5z"/></svg><div class="m"><b>Motion</b><small>The sky follows your phone</small></div>%MOTION%</div>
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/></svg><div class="m"><b>How dark is your sky?</b><small>Suburbs · <span class="lnk">Match outside</span></small><div class="sl"></div></div></div>
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a8 8 0 1 0 8 8"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg><div class="m"><b>Night owl</b><small>Plan past midnight, all the way to dawn</small></div>%TOG%</div>
  <!--S Aiming 03-->
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg><div class="m"><b>Circle highlights</b><small>Satellites, rocket stages…</small></div><span class="ch">›</span></div>
  <div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v4M12 17v4"/></svg><div class="m"><b>Compass</b><small>Lined up against the Moon · 2 h ago</small></div><span class="lnk">Line up</span></div>
</template>
<script>
const OPTS = [
  ['A', 'A · Field cards (today)', 'Double cream frame, numbered gold header bar, boxed ON/OFF tags. Its own look: the frame colour and gold appear nowhere else.'],
  ['B', 'B · Quiet panels', '<b>Recommended.</b> Orange heading above each group, then one plain panel: 14px corners, the soft edge every Tonight panel has, real switches. Calm, and it matches the rest of the app now.'],
  ['C', 'C · Divided list', 'No boxes at all: headings and rows on the page with thin lines between, exactly like Tonight’s run and Find. The lightest; long Settings reads as one list.'],
  ['D', 'D · Card stock', 'Each group is a game card: silver frame like the Collection cards and rank card, title in the display font. The most “game”, but every page of Settings becomes a stack of cards.'],
];
const tpl = document.getElementById('rows').innerHTML;
const groups = tpl.split(/<!--S (.+?) (\d\d)-->/).slice(1);
const row = document.getElementById('row');
for (const [k, title, text] of OPTS) {
  const toggles = k === 'A' ? ['<span class="tog on">On</span>', '<span class="tog">Off</span>'] : ['<span class="lnk">On ✓</span>', '<span class="sw"></span>'];
  let html = '';
  for (let i = 0; i < groups.length; i += 3) {
    const name = groups[i], num = groups[i + 1], body = groups[i + 2].replace('%MOTION%', toggles[0]).replace('%TOG%', toggles[1]);
    if (k === 'A') html += `<div class="card"><div class="bar"><span>${name}</span><span>${num}</span></div>${body}</div>`;
    else if (k === 'B') html += `<div class="sec">${name}</div><div class="card">${body}</div>`;
    else if (k === 'C') html += `<div class="sec">${name}<span>${num}</span></div>${body}`;
    else html += `<div class="card"><div class="bar"><b>${name}</b><span>${num}</span></div>${body}</div>`;
  }
  row.insertAdjacentHTML('beforeend', `<div class="opt ${k}"><h2>${title}</h2><p>${text}</p><div class="phone"><div class="hdr"><b>Settings</b><small>Make it yours</small></div><div class="pg">${html}</div></div></div>`);
}
</script>
</body></html>
