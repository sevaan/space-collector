<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../">
<title>Site Stage</title>
<link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/ui.css">
<style>html, body { margin: 0; background: transparent; } #stage { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; } #stage .card { font-size: 12px; } .pt { width: 240px; } .pt .patch, .pt svg { display: block; width: 100%; height: auto; }</style>
</head><body><div id="stage"></div>
<script type="module">
import { renderCard } from './js/card.js?v=0.1.755';
import { expandFacts } from './js/catalog-facts.js?v=0.1.755';
import { buildCards } from './js/card-model.js?v=0.1.755';
import { loadLore } from './js/lore.js?v=0.1.755';
import { loadConstellations, CONSTELLATIONS } from './js/constellations.js?v=0.1.755';
import './js/stories.js?v=0.1.680';
import { patchHtml } from './js/patches.js?v=0.1.755';
import { ACHIEVEMENTS } from './js/progress.js?v=0.1.755';
import { SECRET_PATCHES } from './js/secrets.js?v=0.1.755';
await Promise.all([loadLore(), loadConstellations()]);
const cat = await (await fetch('data/catalog.json')).json(); for (const o of cat.objects) expandFacts(o);
const cards = buildCards(cat), byKey = new Map(cards.map((c) => [c.key, c]));
const legend = cards.find((c) => c.tier === 'legendary' && !c.natural && !c.launches && c.type === 'satellite' && /HST|OSCAR|ECHO|VANGUARD|TELSTAR|SKYLAB|EXPLORER/.test(c.name)) ?? cards.find((c) => c.tier === 'legendary' && !c.natural && !c.launches);
const stage1981 = cards.find((c) => c.type === 'rocket-body' && String(c.launch ?? '').startsWith('1981') && c.tier === 'uncommon');
const gonets = cards.find((c) => /GONETS-M 11/.test(c.name));
const ori = CONSTELLATIONS.find((c) => /orion/i.test(c.name));
const want = [['iss', '25544'], ['hubble', '20580'], ['andromeda', 'deep:andromeda'], ['saturn', 'planet:saturn'], ['moon', 'moon'], ['stage', stage1981?.key], ['legend', legend?.key], ['shiny', gonets?.key, 'eclipse'], ['wow', 'story:wow'], ['betelgeuse', 'star:betelgeuse'], ['jupiter', 'planet:jupiter'], ['pleiades', 'deep:pleiades']];
const st = document.getElementById('stage'); const out = {};
for (const [name, key, shiny] of want) {
  const c = byKey.get(key); if (!c) { out[name] = 'missing ' + key; continue; }
  const owned = new Set(ori?.stars ?? []);
  const el = renderCard(c, { sightings: [{ time: Date.parse('2026-10-16T21:14:00-04:00'), cardKey: key, ...(shiny ? { shiny } : {}) }], ownedKeys: owned });
  const w = document.createElement('div'); w.className = 'cw'; w.dataset.name = name; w.append(el); st.append(w); out[name] = c.name + ' · ' + c.tier;
}
const ach = new Map(ACHIEVEMENTS.map((a) => [a.id, a]));
for (const id of ['first', 'moon', 'legend', 'shiny', 'station', 'zodiac', 'starlink', 'race', 'twilight', 'cons25']) { const a = ach.get(id); if (!a) continue; const w = document.createElement('div'); w.className = 'pt'; w.dataset.name = 'patch-' + id; w.innerHTML = patchHtml(a); st.append(w); }
for (const id of ['plus', 'meteor', 'santa']) { const w = document.createElement('div'); w.className = 'pt'; w.dataset.name = 'patch-' + id; w.innerHTML = patchHtml(SECRET_PATCHES[id]); st.append(w); }
{ const w = document.createElement('div'); w.className = 'pt'; w.dataset.name = 'patch-ufo'; w.innerHTML = patchHtml({ id: 'ufo', name: 'Close Encounter', icon: '', secret: true }); st.append(w); }
{ const w = document.createElement('div'); w.className = 'pt'; w.dataset.name = 'patch-fossil'; w.innerHTML = patchHtml({ id: 'fossil', name: 'Fossil Hunter', icon: '', secret: true }); st.append(w); }
await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
window.__out = out; document.body.dataset.ready = '1';
</script></body></html>
