<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<base href="../">
<title>Plus Sheet Mock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/ui.css">
<style>
  /* Mockup of the Plus sheet (2026-10-16, Sevaan: "make it look more like a card"): the Plus card is drawn by the game's
     own renderCard, the shiny ISS by miniCard. Not part of the app; screenshotted for the design board. */
  :root { color-scheme: dark; }
  html, body { overflow-x: hidden; margin: 0; background: #070d17; color: #fff2b3; font-family: 'SC Label', 'Barlow Condensed', sans-serif; }
  .sheet { overflow-x: clip; margin-top: 56px; border-radius: 22px 22px 0 0; background: #0e1a29; border-top: 1px solid #2b3d52; padding: 12px 16px 22px; display: grid; gap: 14px; min-height: calc(100vh - 56px); box-sizing: border-box; }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: #3a4c60; justify-self: center; }
  .host { display: grid; justify-items: center; }
  .host .card { font-size: min(11px, calc((100vw - 56px) / 28)); }
  .box { border: 1px solid #2b3d52; border-radius: 12px; background: #0a1220; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
  .box b { font: 600 13px/1.1 'SC Label', 'Barlow Condensed', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #fff2b3; }
  .box small { font: 500 12px/1.2 'SC Label', 'Barlow Condensed', sans-serif; letter-spacing: .04em; color: #9fb3c8; }
  #plus .card--mission .card__art { aspect-ratio: 16 / 11; }
  #plus .card__stats b.inf { font-size: 1.9em; line-height: .9; }
  .member-patch { position: absolute; right: .7em; bottom: .7em; width: 6.4em; z-index: 6; filter: drop-shadow(0 .2em .4em #000c); transform: rotate(-8deg); }
  .member-patch .patch, .member-patch svg { display: block; width: 100%; height: auto; }
  .perks { display: grid; grid-template-columns: auto 1fr; column-gap: .8em; row-gap: .6em; }
  .perks b { white-space: nowrap; }
  .prices, .cta, .fine { width: min(308px, calc(100vw - 56px)); justify-self: center; box-sizing: border-box; }
  .prices { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .pr { border-radius: 12px; border: 1px solid #2b3d52; background: #122033; padding: 10px 6px; display: grid; gap: 4px; justify-items: center; }
  .pr small { font: 600 12px/1 'SC Label', 'Barlow Condensed', sans-serif; letter-spacing: .18em; color: #9fb3c8; }
  .pr b { font: 400 21px/1 'SC Display', 'Russo One', sans-serif; color: #fff2b3; }
  .pr em { font: 600 10.5px/1 'SC Label', 'Barlow Condensed', sans-serif; letter-spacing: .12em; color: #fa8127; font-style: normal; min-height: 11px; }
  .pr.on { border-color: #fa8127; background: #2a1d14; } .pr.on small { color: #fa8127; }
  .cta { border-radius: 12px; padding: 15px; text-align: center; background: #fa8127; color: #1a0f05; font: 600 15px/1 'SC Label', 'Barlow Condensed', sans-serif; letter-spacing: .16em; text-transform: uppercase; }
  .fine { text-align: center; font: 500 12.5px/1.3 Inter, system-ui, sans-serif; color: #9fb3c8; margin-top: -6px; }
  .links { display: flex; justify-content: center; gap: 18px; font: 600 12px/1 'SC Label', 'Barlow Condensed', sans-serif; letter-spacing: .14em; color: #9fb3c8; text-transform: uppercase; }
</style>
</head>
<body>
<div class="sheet">
  <span class="grab"></span>
  <div class="host" id="plus"></div>
  <div class="prices">
    <div class="pr"><small>MONTH</small><b>$1.99</b><em></em></div>
    <div class="pr on"><small>YEAR</small><b>$9.99</b><em>BEST VALUE</em></div>
    <div class="pr"><small>FOREVER</small><b>$24.99</b><em>ONE TIME</em></div>
  </div>
  <div class="cta">Try Plus free for 7 days</div>
  <p class="fine">Then $9.99 a year. Shared with your family.<br>Every card, patch and mission stays free.</p>
  <div class="links"><span>Restore purchases</span></div>
</div>
<script type="module">
import { renderCard } from './js/card.js';
import { CARD_BACKS } from './js/card-backs.js';
import { patchHtml } from './js/patches.js';
// The Plus card: a Legendary "membership" card with the telescope picture and the three perks as its stats.
const plus = { key: 'plus', id: 'plus', natural: 'planet', type: 'planet', name: 'Space Collector Plus', tier: 'legendary', set: 'wanderers',
  stats: [['REMINDERS', '∞', ''], ['CARD BACKS', '6', ''], ['SHINY FORECAST', 'On', ''], ['FREE TRIAL', '7', 'days']],
  fact: 'Plus perks.' };
const el = renderCard(plus, { sightings: [{ time: Date.now(), cardKey: 'plus', shiny: 'overhead' }] });
el.classList.add('shiny'); el.querySelector('.card')?.classList.add('shiny');
const img = el.querySelector('.card__art img') ?? Object.assign(document.createElement('img'), { className: 'card-art-image' });
img.src = 'design/plus-art.webp'; img.alt = ''; if (!img.isConnected) el.querySelector('.card__art')?.prepend(img);
el.querySelector('.card__art')?.querySelectorAll('svg, canvas, .art-stars').forEach((n) => n.remove());
const fact = el.querySelector('.card__fact p'); if (fact) fact.innerHTML = '<span class="perks"><b>Pass reminders</b><span>Alerts for any pass you choose.</span><b>Rare alerts</b><span>A ping when a new Rare card passes.</span><b>Shiny forecast</b><span>When and where a Shiny can happen.</span><b>Card backs</b><span>6 designs, or a random one each flip.</span><b>Member patch</b><span>Only Plus members wear this one.</span></span>';
const set = el.querySelector('.m-set, .card__setbar'); if (set) set.textContent = 'MEMBERSHIP';
const tier = el.querySelector('.m-tier, .card__tier'); if (tier) tier.innerHTML = '★ PLUS';
const role = el.querySelector('.card__identity > span'); if (role) role.textContent = 'Membership · extras for collectors'; const mono = el.querySelector('.card__identity .card__mono'); if (mono) mono.textContent = 'CANCEL ANYTIME';
const foot = el.querySelector('.card__footer'); if (foot) foot.innerHTML = '<span class="mini-status" style="font-size:1.1em">FIRST 7 DAYS FREE</span><span style="margin-left:auto;font:400 1em var(--display, Russo One)">SPACE COLLECTOR</span>';
// The member patch, stitched onto the picture's corner.
el.querySelector('.card__art')?.insertAdjacentHTML('beforeend', `<span class="member-patch">${patchHtml({ id: 'legend', name: 'Plus Member', sub: 'Space Collector' })}</span>`);
const tag = el.querySelector('.shiny-tag'); if (tag) tag.textContent = '✦ SHINY · PLUS MEMBER';
const inf = [...el.querySelectorAll('.card__stats > div')].find((d) => /REMINDERS/.test(d.textContent))?.querySelector('b'); if (inf) inf.classList.add('inf');
document.getElementById('plus').appendChild(el);
// Starts face down on a random back, then turns over after a second (same flip as a double tap: faces swap edge-on).
const back = el.querySelector('.card__back');
const b = CARD_BACKS[Math.floor(Math.random() * CARD_BACKS.length)];
if (back) { back.style.backgroundImage = `url('${b.url}')`; back.style.opacity = '1'; }
el.style.transform = 'perspective(1600px) rotateY(180deg)';
setTimeout(() => {
  const ms = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 620;
  const a = el.animate([
    { transform: 'perspective(1600px) rotateY(180deg)', easing: 'cubic-bezier(.45,0,.9,.6)' },
    { transform: 'perspective(1600px) rotateY(270deg) scale(1.04)', easing: 'cubic-bezier(.1,.4,.55,1)', offset: .5 },
    { transform: 'perspective(1600px) rotateY(360deg)' }], { duration: ms, fill: 'forwards' });
  let swapped = false;
  const tick = () => { const t = a.currentTime ?? ms; if (!swapped && t >= ms / 2) { swapped = true; if (back) back.style.opacity = ''; }
    if (t < ms && a.playState !== 'finished') requestAnimationFrame(tick); else { if (back) back.style.opacity = ''; a.cancel(); el.style.transform = ''; } };
  requestAnimationFrame(tick);
}, 1000);
document.body.dataset.ready = '1';
</script>
</body>
</html>
