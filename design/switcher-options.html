<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switcher Options</title>
<style>
  @font-face { font-family: 'SC Label'; src: url('../fonts/BarlowCondensed-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'SC Display'; src: url('../fonts/RussoOne-Regular.ttf'); }
  body { margin: 0; background: #04070d; color: #e8eef6; font: 15px/1.45 -apple-system, system-ui, sans-serif; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 6px; } .intro { color: #9fb0c6; margin: 0 0 24px; max-width: 820px; }
  .board { display: flex; flex-wrap: wrap; gap: 30px 24px; justify-content: center; }
  .opt { width: 390px; max-width: 100%; } .opt h2 { font-size: 16px; margin: 12px 0 4px; } .opt p { color: #9fb0c6; font-size: 13.5px; margin: 0; }
  .phone { position: relative; width: 390px; height: 420px; max-width: 100%; border-radius: 0 0 40px 40px; overflow: hidden; border: 1px solid #1d2838;
    background: url(switcher-bg.jpg) top / 390px auto no-repeat, #0a1120; }
  .phone::after { content: ''; position: absolute; left: 0; right: 0; top: 300px; bottom: 0; background: linear-gradient(#0a112000, #0a1120 30%); }
  .lab { font: 500 15px/1 'SC Label', 'Arial Narrow', sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .ico { width: 19px; height: 19px; flex: none; }
  nav { position: absolute; z-index: 2; display: flex; }
  nav a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none; }
  /* A: quiet segmented bar */
  .A nav { left: 18px; right: 18px; bottom: 30px; height: 54px; background: rgba(8, 14, 26, .82); border: 1px solid rgba(188, 181, 133, .45); border-radius: 12px; backdrop-filter: blur(8px); }
  .A nav a { color: #8f8a72; position: relative; } .A nav a + a { border-left: 1px solid rgba(188, 181, 133, .3); }
  .A nav a.on { color: #fff2b3; } .A nav a.on::after { content: ''; position: absolute; left: 30%; right: 30%; bottom: 7px; height: 2px; background: #fa8127; border-radius: 2px; }
  .A nav a.on .ico { color: #fa8127; }
  /* B: card footer */
  .B nav { left: 0; right: 0; bottom: 0; height: 84px; padding-bottom: 22px; background: #080e1a; border-top: 1px solid #bcb585; }
  .B nav a { color: #7f7b67; } .B nav a + a { border-left: 1px solid rgba(188, 181, 133, .5); margin: 14px 0 0; }
  .B nav a:first-child { margin-top: 14px; }
  .B nav a.on { color: #fff2b3; } .B nav a.on::before { content: '◆'; color: #fa8127; font-size: 10px; margin-right: -2px; }
  /* C: small floating pill, dim lamp */
  .C nav { left: 50%; transform: translateX(-50%); bottom: 34px; width: 260px; height: 46px; padding: 4px; gap: 4px; background: rgba(8, 14, 26, .78); border: 1px solid #3a4a5e; border-radius: 99px; backdrop-filter: blur(8px); }
  .C nav a { border-radius: 99px; color: rgba(255, 242, 179, .55); font-size: 14px; }
  .C nav a.on { color: #fa8127; background: rgba(250, 129, 39, .14); box-shadow: inset 0 0 0 1px rgba(250, 129, 39, .45); }
  .cur nav { left: 18px; right: 18px; bottom: 30px; height: 64px; border-radius: 12px; overflow: hidden; background: #fff2b3; }
  .cur nav a { color: #18272b; } .cur nav a.on { background: #e9893f; }
</style></head><body>
<h1>Explore / Collection switcher: three quieter options</h1>
<p class="intro">Same screen as your screenshot (looking south under the horizon). The current switcher is first for comparison. All three keep the retro fonts and the orange accent, but only as a small marker, so the bar stops competing with the sky.</p>
<div class="board" id="b"></div>
<script>
const planet = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6"/><ellipse cx="12" cy="12" rx="11" ry="3.6" transform="rotate(-20 12 12)"/></svg>';
const bag = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="7" width="16" height="14" rx="3"/><path d="M9 7V5a3 3 0 0 1 6 0v2M4 12h16"/></svg>';
const nav = (icons) => `<nav class="lab"><a class="on">${icons ? planet : ''}Explore</a><a>${icons ? bag : ''}Collection</a></nav>`;
const opts = [
  ['cur', 'Now', 'Solid cream and orange slab: the brightest thing on screen at night.', true],
  ['A', 'A. Quiet bar', 'Same shape and place, but dark and see-through with a thin gold rule. The active tab is cream with an orange icon and a short orange underline; the other is dim.', true],
  ['B', 'B. Card footer', 'A full-width dark strip with a gold rule on top, split by a thin rule, like the footer of a card. The active tab gets a small orange diamond. The lowest-key option.', true],
  ['C', 'C. Small pill', 'A compact pill floating in the middle, text only. The active tab glows faintly orange, like a dimmed lamp. Leaves the most sky visible.', false],
];
document.getElementById('b').innerHTML = opts.map(([c, t, d, i]) => `<div class="opt"><div class="phone ${c}">${nav(i)}</div><h2>${t}</h2><p>${d}</p></div>`).join('');
</script></body></html>
