<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth styles</title>
<link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/ui.css">
<style>
  body { margin: 0; background: #05090f; color: #fff2b3; font: 15px/1.45 system-ui, sans-serif; padding: 28px 24px 60px; }
  h1 { font: 400 30px/1.1 'SC Display', 'Russo One', sans-serif; margin: 0 0 6px; } p.lead { color: #bdbea9; max-width: 900px; margin: 0 0 26px; }
  .row { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
  .lab { font: 500 13px/1 'SC Label', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #fa8127; margin: 0 0 6px; }
  .note { color: #9aa7b4; font-size: 13px; max-width: 300px; margin: 0 0 12px; min-height: 3.2em; }
  .card { font-size: 10.5px; }
</style></head><body>
<h1>Earth styles</h1>
<p class="lead">The same NOAA 12 debris card five times, each with a different Earth in its live orbit view. Pick a letter. The orbits and satellites are real; only the Earth changes.</p>
<div class="row" id="row"></div>
<script type="module">
const V = (await fetch('version.json', { cache: 'no-store' }).then((r) => r.json())).version, at = (f) => import(new URL(`js/${f}?v=${V}`, document.baseURI).href);
const [{ expandFacts }, { renderCard }, { buildCards }, { loadLore }, { orbitGlobe }] = await Promise.all(['catalog-facts.js', 'card.js', 'card-model.js', 'lore.js', 'orbit-view.js'].map(at));
const cat = await fetch('data/catalog.json').then((r) => r.json()); for (const o of cat.objects) expandFacts(o);
await loadLore();
const c = buildCards(cat).find((x) => Number(x.id) === 37832), sight = [{ time: Date.parse('2026-09-30T03:00:00Z'), cardKey: c.key, objectId: c.id }];
const S = [['engraved', 'A · Engraved', 'Cream land with fine hatching, deep blue ocean, orange glow on the rim.'],
  ['daynight', 'B · Day and night', 'Lit by the real Sun at this moment: the night side is in shadow, with a soft line between.'],
  ['blueprint', 'C · Blueprint', 'In the app (Sevaan’s pick): coastlines in cream ink on dark navy, a finer grid, no fill.'],
  ['dots', 'D · Dot globe', 'Land as evenly spaced cream dots, brighter where the light falls.'],
  ['poster', 'E · Poster', 'Flat poster colours from the cards: steel blue sea, burnt orange land, cream outlines.']];
const row = document.getElementById('row'), me = { lat: 44.3, lon: -78.3 };
for (const [style, name, note] of S) {
  const w = document.createElement('div'); w.innerHTML = `<div class="lab">${name}</div><div class="note">${note}</div>`; row.append(w);
  const el = renderCard(c, { sightings: sight }); w.append(el);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const box = el.querySelector('.frag-orbit-box'); box.querySelectorAll('canvas').forEach((x) => x.remove()); orbitGlobe(c, box, me, { style });
}
document.body.dataset.ready = '1';
</script></body></html>
