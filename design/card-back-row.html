<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card back row</title>
<style>
@font-face { font-family: 'L'; src: url('../fonts/BarlowCondensed-Medium.ttf'); }
@font-face { font-family: 'D'; src: url('../fonts/RussoOne-Regular.ttf'); }
* { box-sizing: border-box; }
body { margin: 0; background: #1b2230; color: #fff2b3; font: 500 15px/1.3 'L', sans-serif; padding: 24px 16px; }
h1 { font: 400 24px 'D'; margin: 0 0 18px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 24px; }
.opt { width: 380px; } .opt h2 { font: 400 17px 'D'; margin: 0 0 4px; } .opt p { margin: 0 0 10px; color: #bdbea9; font-size: 14px; min-height: 38px; } .opt p b { color: #fa8127; font-weight: 500; }
.phone { background: #080f1b; border-radius: 22px; padding: 18px 16px; border: 1px solid #2c3648; }
.sec { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #fa8127; margin: 0 4px 8px; }
.card { border: 1px solid #22344a; border-radius: 14px; background: #0e1a29; overflow: hidden; }
.r { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 14px; }
.r + .r { border-top: 1px solid #ffffff10; }
.r .ico { width: 22px; height: 22px; color: #fff2b3; flex: none; }
.r .m { flex: 1; min-width: 0; } .r .m b { display: block; font-weight: 500; font-size: 16.5px; } .r .m small { display: block; color: #bdbea9; font-size: 13.5px; }
.r .v { color: #bdbea9; font-size: 15px; white-space: nowrap; } .r .ch { color: #bdbea9; font-size: 18px; }
.back { flex: none; border-radius: 4px; background: #01121c url('../assets/art/backs/back-collector.webp') center / contain no-repeat; box-shadow: 0 0 0 1px #c9c1a066, 0 4px 10px #000a; }
.A .back { width: 24px; height: 34px; }
.B .back { width: 30px; height: 42px; transform: rotate(-4deg); }
.C .r.big { min-height: 96px; } .C .back { width: 52px; height: 74px; transform: rotate(-4deg); }
.C .lnk { color: #fa8127; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.D .fan { position: relative; width: 70px; height: 46px; flex: none; }
.D .fan i { position: absolute; bottom: 0; width: 30px; height: 42px; border-radius: 4px; background: #01121c center / contain no-repeat; box-shadow: 0 0 0 1px #c9c1a066, 0 4px 10px #000a; transform-origin: 50% 100%; }
.D .fan i:nth-child(1) { left: 2px; transform: rotate(-14deg); background-image: url('../assets/art/backs/back-golden-record.webp'); opacity: .55; }
.D .fan i:nth-child(2) { left: 36px; transform: rotate(14deg); background-image: url('../assets/art/backs/back-aurora.webp'); opacity: .55; }
.D .fan i:nth-child(3) { left: 19px; background-image: url('../assets/art/backs/back-collector.webp'); }
</style></head><body>
<h1>Card back in Settings</h1>
<div class="row-wrap" id="w"></div>
<template id="rows">
<div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><div class="m"><b>Observer stats</b><small>Your nights, places and rarest finds</small></div><span class="ch">›</span></div>
<div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/></svg><div class="m"><b>Space Collector Plus</b><small>Reminders, card backs and more</small></div><span class="v">Free</span><span class="ch">›</span></div>
%BACK%
</template>
<script>
const OPTS = [
 ['A', 'A · Back as the icon', 'The little card back replaces the icon on the left; the name stays on the right.',
  `<div class="r"><span class="back"></span><div class="m"><b>Card back</b><small>The back of every card you flip</small></div><span class="v">Mission Control</span><span class="ch">›</span></div>`],
 ['B', 'B · Back on the right', '<b>Recommended.</b> The row reads like the others; the name moves to the subtitle and the back itself sits where the value goes, tilted like a card.',
  `<div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="2"/></svg><div class="m"><b>Card back</b><small>Mission Control</small></div><span class="back"></span><span class="ch">›</span></div>`],
 ['C', 'C · A bigger row', 'The back is shown big enough to see the design, with its name and Change.',
  `<div class="r big"><span class="back"></span><div class="m"><b>Card back</b><small>Mission Control · on every card you flip</small></div><span class="lnk">Change</span></div>`],
 ['D', 'D · A small fan', 'Your back in front, two others peeking behind it, hinting there are more to pick.',
  `<div class="r"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="2"/></svg><div class="m"><b>Card back</b><small>Mission Control</small></div><span class="fan"><i></i><i></i><i></i></span><span class="ch">›</span></div>`],
];
const t = document.getElementById('rows').innerHTML;
for (const [k, h, p, back] of OPTS) document.getElementById('w').insertAdjacentHTML('beforeend', `<div class="opt ${k}"><h2>${h}</h2><p>${p}</p><div class="phone"><div class="sec">Collection</div><div class="card">${t.replace('%BACK%', back)}</div></div></div>`);
</script>
</body></html>
