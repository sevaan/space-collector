# Refreshes the satellite catalogue from CelesTrak once a day, so new Starlink trains show up and
# objects that have reentered drop out. Only commits when the data changed.
name: Daily catalogue

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build-catalog.mjs
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/catalog.json; then echo "No change"; exit 0; fi
          git config user.name "catalogue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "Daily catalogue refresh"
          # GitHub occasionally rejects a push with a 500; rebase onto anything new and retry a few times.
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; echo "push failed, retrying in $((i*15))s"; sleep $((i*15)); done
          git diff --quiet origin/main HEAD -- data/catalog.json || { echo "could not push"; exit 1; }
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
